<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MOZAIQ People Strategy · 채용 유통 6단계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F8F8F4; --ink:#1E2320; --muted:#6E736C; --rule:#D5D8D0;
  --int:#2E4A3D; --int-tint:#E4ECE7;
  --ext:#8E6B43; --ext-tint:#F0E8DD;
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);word-break:keep-all;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.stage-app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(20px,3.2vh,40px) clamp(24px,4vw,64px)}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--ink);padding-bottom:clamp(12px,2vh,20px)}
.top h1{font-family:var(--serif);font-weight:800;font-size:clamp(28px,3.6vw,48px);line-height:1.15;margin:0;letter-spacing:-.01em}
.top p{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,1.2vw,17px)}
.meta{font-size:13px;color:var(--muted);text-align:right;line-height:1.6;white-space:nowrap}
.meta b{font-family:var(--serif);color:var(--ink);font-size:16px;font-weight:700}
.meta a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.meta a:hover{border-color:var(--muted)}
.meta a[aria-current="page"]{color:var(--ink);font-weight:600;border-color:var(--ink)}

/* 본문 */
.body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);min-height:0;padding:clamp(16px,3vh,32px) 0}

/* 피라미드 */
.pyr-wrap{display:grid;grid-template-columns:auto 1fr;gap:18px;min-height:0}
.axis{display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);text-align:center;line-height:1.4;padding:4px 0}
.axis .line{flex:1;width:1px;background:var(--muted);margin:10px 0;position:relative}
.axis .line::after{content:"";position:absolute;bottom:-1px;left:-4px;border:4.5px solid transparent;border-top:7px solid var(--muted);border-bottom:0}
.axis span{writing-mode:horizontal-tb;max-width:5.5em}

.pyramid{display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1vh,10px);min-height:0;position:relative}
.tier{display:flex;align-items:center;gap:14px;margin:0 auto;border:1px solid transparent;cursor:pointer;text-align:left;
  height:clamp(48px,9vh,84px);padding:0 clamp(14px,1.6vw,22px);transition:background-color .2s,color .2s,border-color .2s}
.tier[data-g="int"]{background:var(--int-tint);border-color:#C9D6CF}
.tier[data-g="ext"]{background:var(--ext-tint);border-color:#E0D2BF}
.tier .n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
  font-family:var(--serif);font-weight:800;font-size:16px;color:#fff}
.tier[data-g="int"] .n{background:var(--int)} .tier[data-g="ext"] .n{background:var(--ext)}
.tier .t{font-weight:600;font-size:clamp(14px,1.35vw,19px);line-height:1.3}
.tier .s{display:block;font-weight:400;font-size:clamp(11.5px,.95vw,13.5px);color:var(--muted);margin-top:2px}
.tier:hover{border-color:var(--ink)}
.tier[aria-pressed="true"][data-g="int"]{background:var(--int);color:#fff;border-color:var(--int)}
.tier[aria-pressed="true"][data-g="ext"]{background:var(--ext);color:#fff;border-color:var(--ext)}
.tier[aria-pressed="true"] .n{background:#fff;color:var(--ink)}
.tier[aria-pressed="true"] .s{color:rgba(255,255,255,.8)}
.pyramid.dim .tier:not([aria-pressed="true"]){opacity:.55}
.w6{width:50%}.w5{width:60%}.w4{width:70%}.w3{width:80%}.w2{width:90%}.w1{width:100%}

.divider{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:2px 0}
.divider::before{content:"";flex:1;border-top:1px dashed var(--muted)}
.divider .ext{order:-1;color:var(--ext);font-weight:600}
.divider .int{color:var(--int);font-weight:600}
.divider .ext::after{content:"";}

/* 패널 */
.panel{border-left:1px solid var(--rule);padding-left:clamp(24px,3vw,48px);display:flex;flex-direction:column;justify-content:center;min-height:0}
.panel-inner{transition:opacity .18s ease}
.panel-inner.fade{opacity:0}
.nb{white-space:nowrap}
.intro-q{font-family:var(--serif);font-weight:800;font-size:clamp(28px,3vw,44px);line-height:1.3;margin:0 0 12px}
.intro-p{font-size:clamp(15px,1.25vw,18px);line-height:1.8;color:#3C423E;margin:0 0 28px;max-width:30em}
.intro-sub{font-size:clamp(17px,1.6vw,24px);line-height:1.6;color:var(--muted);margin:0}
.kbd{display:inline-block;border:1px solid var(--rule);padding:0 6px;margin:0 2px;font-size:12px;background:#fff}

.p-head{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
.p-num{font-family:var(--serif);font-weight:800;font-size:clamp(48px,5.5vw,84px);line-height:1}
.p-grp{font-size:13px;font-weight:600}
.p-title{font-family:var(--serif);font-weight:800;font-size:clamp(26px,2.8vw,40px);line-height:1.25;margin:0 0 clamp(20px,3.5vh,36px)}
.rows{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0}
.rows dt,.rows dd{padding:clamp(12px,2vh,18px) 0;border-top:1px solid var(--rule);margin:0}
.rows dt{font-size:13px;font-weight:600;color:var(--muted);padding-right:24px;padding-top:calc(clamp(12px,2vh,18px) + 4px)}
.rows dd{font-size:clamp(16px,1.4vw,20px);line-height:1.6}
.rows dd.todo{color:var(--muted)}
.rows dt.plan{color:var(--ink)}
.rows dd.plan{font-family:var(--serif);font-weight:700;font-size:clamp(19px,1.8vw,26px);line-height:1.5}
.rows dt:last-of-type,.rows dd:last-of-type{border-bottom:1px solid var(--ink)}

/* 하단 */
.bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--rule);padding-top:12px;font-size:13px;color:var(--muted)}
.nav{display:flex;gap:6px}
.nav button{border:1px solid var(--rule);background:#fff;padding:6px 14px;cursor:pointer}
.nav button:hover{border-color:var(--ink)}

@media (prefers-reduced-motion:reduce){.tier,.panel-inner{transition:none}}

@media (max-width:860px){
  html,body{height:auto}
  .stage-app{height:auto;min-height:100%}
  .top{flex-direction:column;align-items:flex-start}
  .meta{text-align:left}
  .body{grid-template-columns:1fr}
  .panel{border-left:0;border-top:1px solid var(--rule);padding:24px 0 0}
  .tier{height:auto;min-height:56px;padding:8px 14px}
  .w6{width:70%}.w5{width:76%}.w4{width:82%}.w3{width:88%}.w2{width:94%}
  .nb{white-space:normal}
  .axis{display:none}
  .pyr-wrap{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="stage-app">

  <header class="top">
    <div>
      <h1>채용 유통 6단계</h1>
      <p>모자이크 채용 채널 전략</p>
    </div>
    <div class="meta"><b>MOZAIQ People Strategy</b><br><a href="./" aria-current="page">Part 1. 채용</a> &nbsp;/&nbsp; <a href="./culture.html">Part 2. 조직문화</a></div>
  </header>

  <main class="body">
    <div class="pyr-wrap">
      <div class="axis" aria-hidden="true">
        <span>비용 높음<br>적합도 낮음</span>
        <div class="line"></div>
        <span>비용 낮음<br>적합도 높음</span>
      </div>
      <div class="pyramid" id="pyramid" role="group" aria-label="채용 유통 6단계">
        <button class="tier w6" data-i="6" data-g="ext" aria-pressed="false"><span class="n">6</span><span class="t">채용 사이트<span class="s">채용 플랫폼, 자사 홈페이지</span></span></button>
        <button class="tier w5" data-i="5" data-g="ext" aria-pressed="false"><span class="n">5</span><span class="t">직종 온라인 커뮤니티<span class="s">업계 종사자 커뮤니티, 학과 연계</span></span></button>
        <button class="tier w4" data-i="4" data-g="ext" aria-pressed="false"><span class="n">4</span><span class="t">서치펌·인재 서칭<span class="s">리멤버, 링크드인</span></span></button>
        <div class="divider" aria-hidden="true"><span class="ext">▲ 외부 채널</span><span class="int">내부 채널 ▼</span></div>
        <button class="tier w3" data-i="3" data-g="int" aria-pressed="false"><span class="n">3</span><span class="t">직원·지인 추천<span class="s">추천 제도, 사내 채용 공지</span></span></button>
        <button class="tier w2" data-i="2" data-g="int" aria-pressed="false"><span class="n">2</span><span class="t">사내 채용<span class="s">직무 이동, 승진, 리스킬링</span></span></button>
        <button class="tier w1" data-i="1" data-g="int" aria-pressed="false"><span class="n">1</span><span class="t">기업 평판 관리<span class="s">블라인드, 잡플래닛, 온라인 여론</span></span></button>
      </div>
    </div>

    <section class="panel" aria-live="polite">
      <div class="panel-inner" id="panel"></div>
    </section>
  </main>

  <footer class="bottom">
    <span><span class="kbd">←</span><span class="kbd">→</span> 또는 <span class="kbd">1</span>~<span class="kbd">6</span> 로 이동, <span class="kbd">0</span> 처음으로</span>
    <div class="nav">
      <button type="button" id="prev" aria-label="이전 단계">이전</button>
      <button type="button" id="next" aria-label="다음 단계">다음</button>
    </div>
  </footer>
</div>

<script>
const DATA = {
  1:{title:"기업 평판 관리", g:"int",
     def:"지원자가 지원 전 접하는 회사에 대한 외부 정보",
     now:"블라인드, 잡플래닛 등에 기업 정보 미형성",
     plan:"퇴사 경험(오프보딩) 설계와 재직자 목소리를 듣는 정기 채널 운영"},
  2:{title:"사내 채용", g:"int",
     def:"직무 이동, 승진, 리스킬링을 통한 내부 충원",
     now:"별장 30여 채에서 지속 확장 중, 신규 별장마다 현장 리더 수요 발생",
     plan:"공석 발생 시 내부 공모 우선 원칙과 현장 리더 승격 기준 명문화"},
  3:{title:"직원·지인 추천", g:"int",
     def:"임직원 네트워크를 활용한 후보자 추천",
     now:"현장 인력 약 100명이 여러 권역에 분산",
     plan:"추천 보상 인센티브 설계 (입사 시점과 근속 3개월 후 분할 지급)"},
  4:{title:"서치펌·인재 서칭", g:"ext",
     def:"특정 인재를 직접 찾아 제안하는 방식",
     now:"재무, 전략 등 핵심 경영진을 외부 전문가로 영입",
     plan:"서치펌은 핵심 포지션에 한정, 그 외는 다이렉트 소싱을 내부 역량화"},
  5:{title:"직종 온라인 커뮤니티", g:"ext",
     def:"같은 직종 종사자가 모이는 온라인 공간",
     now:"커뮤니티 채널 활용 여부 (확인 필요)", todo:true,
     plan:"호텔·리조트 종사자 커뮤니티 확보와 관광·호텔 학과 산학 연계"},
  6:{title:"채용 사이트", g:"ext",
     def:"채용 플랫폼과 홈페이지의 공개 공고",
     now:"잡코리아 등 일반 플랫폼에 개별 공고 운영",
     plan:"브랜드 톤을 담은 홈페이지 채용 페이지 신설과 공고 템플릿 표준화"}
};

const panel = document.getElementById('panel');
const pyramid = document.getElementById('pyramid');
const tiers = [...document.querySelectorAll('.tier')];
let cur = 0;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(i){
  if(i===0){
    return `<p class="intro-q">Talent Acquisition Strategy</p>
      <p class="intro-sub">단계별 현황 진단과 실행 방안</p>`;
  }
  const d = DATA[i];
  const color = d.g==='int' ? 'var(--int)' : 'var(--ext)';
  return `<div class="p-head"><span class="p-num" style="color:${color}">${i}</span>
      <span class="p-grp" style="color:${color}">${d.g==='int'?'내부 채널':'외부 채널'}</span></div>
    <h2 class="p-title">${esc(d.title)}</h2>
    <dl class="rows">
      <dt>정의</dt><dd>${esc(d.def)}</dd>
      <dt>현황</dt><dd class="${d.todo?'todo':''}">${esc(d.now)}</dd>
      <dt class="plan">방안</dt><dd class="plan">${esc(d.plan)}</dd>
    </dl>`;
}

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i){
  i = Math.max(0, Math.min(6, i));
  cur = i;
  tiers.forEach(t => t.setAttribute('aria-pressed', String(+t.dataset.i === i)));
  pyramid.classList.toggle('dim', i !== 0);
  if(reduce){ panel.innerHTML = render(i); return; }
  panel.classList.add('fade');
  setTimeout(()=>{ panel.innerHTML = render(i); panel.classList.remove('fade'); }, 150);
}

tiers.forEach(t => t.addEventListener('click', () => go(+t.dataset.i === cur ? 0 : +t.dataset.i)));
document.getElementById('prev').addEventListener('click', () => go(cur - 1));
document.getElementById('next').addEventListener('click', () => go(cur + 1));
document.addEventListener('keydown', e => {
  if(e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur + 1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='PageUp'){ e.preventDefault(); go(cur - 1); }
  else if(/^[0-6]$/.test(e.key)){ go(+e.key); }
  else if(e.key==='Escape'){ go(0); }
});

panel.innerHTML = render(0);
</script>
</body>
</html>
